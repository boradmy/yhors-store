    <!-- El HTML indexable sigue disponible como respaldo y para rastreadores.
         El arranque externo está permitido por la CSP script-src 'self'. -->
    <script src="/boot.js?v=16.8.4-csp-fix"></script>
    <style>
      html.yh-store-booting, html.yh-store-booting body { overflow: hidden !important; }
      /* El HTML SSR permanece en el DOM para buscadores y lectores; una cubierta opaca impide verlo durante la carga. */
      #yhBootScreen {
        position: fixed; inset: 0; z-index: 2147483645;
        display: flex; align-items: center; justify-content: center;
        opacity: 0; visibility: hidden; pointer-events: none;
        background: radial-gradient(ellipse at 80% 15%, rgba(172,129,62,.14), transparent 43%),
                    radial-gradient(ellipse at 10% 95%, rgba(122,83,35,.11), transparent 53%), #141414;
        color: #fff; font-family: Arial, Helvetica, sans-serif;
        transition: opacity .45s ease, visibility .45s;
      }
      html.yh-store-booting #yhBootScreen {
        opacity: 1; visibility: visible; pointer-events: auto;
      }
      #yhBootScreen::before { content:''; position:absolute; top:0; left:0; width:100%; height:3px;
        background: linear-gradient(90deg,transparent,#ae8951 33%,#e4c17e 50%,#ae8951 67%,transparent); }
      .yh-boot-layout { width:min(88vw,470px); text-align:center; position:relative; }
      .yh-boot-emblem { display:inline-flex; align-items:baseline; justify-content:center; gap:13px; }
      .yh-boot-emblem strong { font-size:clamp(29px,7vw,55px); font-weight:800; letter-spacing:.33em; padding-left:.33em; line-height:1.2; }
      .yh-boot-emblem small { color:#c5a469; letter-spacing:.28em; font-size:10px; font-weight:700; }
      .yh-boot-rule { width:80px; height:1px; margin:23px auto 25px; background:#bd995d; }
      .yh-boot-title { font-family: Georgia,serif; font-size:clamp(20px,4vw,28px); font-weight:400; margin:0 0 10px; }
      .yh-boot-subtitle { font-size:12px; line-height:1.6; color:#a9a39a; margin:0; letter-spacing:.06em; }
      .yh-boot-progress { display:flex; justify-content:center; align-items:center; gap:7px; margin:30px auto 15px; }
      .yh-boot-progress span { width:7px; height:7px; border-radius:50%; background:#c5a469; animation:yh-boot-pulse 1.3s ease-in-out infinite; }
      .yh-boot-progress span:nth-child(2) { animation-delay:.2s; }
      .yh-boot-progress span:nth-child(3) { animation-delay:.4s; }
      @keyframes yh-boot-pulse { 0%,75%,100%{opacity:.26;transform:scale(.85)} 35%{opacity:1;transform:scale(1.13)} }
      .yh-boot-recovery { margin:24px auto 0; max-width:380px; }
      .yh-boot-recovery[hidden] { display:none !important; }
      .yh-boot-actions { display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:16px; }
      .yh-boot-actions button { border:1px solid #a78958; border-radius:9px; padding:11px 17px;
        background:#c6a265; color:#181818; font:700 12px Arial,sans-serif; cursor:pointer; }
      .yh-boot-actions button+button { background:transparent; color:#e4cfaa; }
      .yh-boot-finished { opacity:0; visibility:hidden; pointer-events:none; transition:opacity .45s ease,visibility .45s; }
      @media (prefers-reduced-motion: reduce) { .yh-boot-progress span{animation:none;opacity:1} .yh-boot-finished {transition:none} }
    </style>

    <style>
      .yh-ssr-home{font-family:Arial,Helvetica,sans-serif;color:#181818;background:#faf8f4;min-height:100vh}
      .yh-ssr-top{background:#171717;color:white;padding:23px clamp(20px,5vw,80px);display:flex;align-items:center;justify-content:space-between;gap:30px;flex-wrap:wrap}
      .yh-ssr-top a{color:inherit;text-decoration:none}.yh-ssr-brand{font-size:22px;font-weight:800;letter-spacing:.28em;white-space:nowrap}.yh-ssr-brand small{font-size:9px;color:#be9856;letter-spacing:.1em}
      .yh-ssr-top nav{display:flex;gap:24px;flex-wrap:wrap;font-size:11px;letter-spacing:.08em}
      .yh-ssr-intro{padding:clamp(50px,8vw,110px) clamp(22px,6vw,110px);background:linear-gradient(125deg,#171717 0%,#26211e 68%,#4a3326 100%);color:white;min-height:350px}
      .yh-ssr-intro>span,.yh-ssr-heading small,.yh-ssr-categories small{color:#c4a06b;font-weight:800;font-size:12px;letter-spacing:.16em}
      .yh-ssr-intro h1{font-weight:800;font-size:clamp(38px,5.2vw,70px);line-height:1.04;max-width:820px;margin:26px 0 18px}
      .yh-ssr-intro p{font-size:16px;max-width:610px;color:#ded8d1;line-height:1.55}.yh-ssr-intro>a{display:inline-block;margin-top:22px;padding:15px 23px;color:#171717;text-decoration:none;border-radius:5px;background:#c09d5d;font-weight:700}
      .yh-ssr-featured,.yh-ssr-categories{padding:clamp(40px,6vw,80px) clamp(22px,5vw,85px)}.yh-ssr-featured{background:#1b1b1b;color:white}
      .yh-ssr-heading{display:flex;align-items:end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:28px}.yh-ssr-heading h2,.yh-ssr-categories h2{font-size:clamp(32px,4vw,52px);margin:8px 0}.yh-ssr-heading p{color:#c4c4c4}
      .yh-ssr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.yh-ssr-product{background:white;color:#1b1b1b;border-radius:18px;overflow:hidden}.yh-ssr-product a{color:inherit;text-decoration:none}.yh-ssr-product-photo{background:#f3f2f0;aspect-ratio:4/5;overflow:hidden}.yh-ssr-product-photo img{display:block;width:100%;height:100%;object-fit:contain}.yh-ssr-product-copy{padding:16px}.yh-ssr-product-copy small{color:#aa813f;font-weight:700;text-transform:uppercase}.yh-ssr-product-copy h3{font-size:16px;margin:12px 0;min-height:2em}.yh-ssr-product-copy span{font-size:12px;font-weight:700}
      .yh-ssr-categories{background:#faf8f4}.yh-ssr-universes{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px;margin-top:26px}.yh-ssr-universe{min-height:116px;padding:18px;border:1px solid #ddd4c8;border-radius:14px;text-decoration:none;color:#1a1a1a;font-size:19px;font-weight:700;display:flex;flex-direction:column;justify-content:space-between}.yh-ssr-universe span{font-size:12px;color:#9b743e}
      @media(max-width:680px){.yh-ssr-top{justify-content:center}.yh-ssr-top nav{justify-content:center;gap:12px}.yh-ssr-intro{min-height:270px}.yh-ssr-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    </style>

    <div id="yhBootScreen" role="status" aria-live="polite" aria-label="Preparando YHORS STORE">
